# Free scheduler for a DEPLOYED GovernIT: calls the protected cron endpoint every hour.
# Setup (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   GOVERNIT_URL   e.g. https://your-domain.example
#   CRON_SECRET    same value as the server's CRON_SECRET
# Does nothing until both secrets exist.
name: Check official sources
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/check-sources
        env:
          GOVERNIT_URL: ${{ secrets.GOVERNIT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$GOVERNIT_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets not set; skipping."; exit 0; fi
          curl --fail-with-body -sS -m 120 -H "Authorization: Bearer $CRON_SECRET" "$GOVERNIT_URL/api/cron/check-sources"
